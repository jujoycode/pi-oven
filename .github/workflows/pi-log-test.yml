name: pi-log test

# 동작 테스트 — 서비스 컨테이너 없이 수 초면 끝난다.
# 원격(ssh) 모드는 러너 자신에게 루프백 sshd를 세워 실제 ssh 경유로 검증한다.

on:
  push:
    paths:
      - "packages/pi-log/**"
      - ".github/workflows/pi-log-test.yml"
  pull_request:
    paths:
      - "packages/pi-log/**"
      - ".github/workflows/pi-log-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up loopback sshd for remote-mode tests
        run: |
          sudo apt-get install -y -qq openssh-server
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/pi_log_test -q
          cat ~/.ssh/pi_log_test.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
      - run: >
          PI_LOG_SSH_HOST="$USER@127.0.0.1"
          PI_LOG_SSH_KEY="$HOME/.ssh/pi_log_test"
          node --experimental-strip-types packages/pi-log/test/log.test.mjs
